# bankcheck web app. Settings go in a `.env` file next to this one (git-ignored):
#   BANKCHECK_PASSWORD=...        required
#   BANKCHECK_BIND=127.0.0.1      where the port is published (default: only this machine)
#   BANKCHECK_PORT=8000
#   TZ=America/Santiago           so "today" (the age of a pending purchase) is local
#   BANKCHECK_NTFY_URL=https://ntfy.sh/<long-secret-topic>   push notifications (optional)
#   BANKCHECK_NOTIFY_DETAILS=1    include merchants in notifications (optional)
services:
  bankcheck:
    build: .
    image: bankcheck
    restart: unless-stopped
    ports:
      - "${BANKCHECK_BIND:-127.0.0.1}:${BANKCHECK_PORT:-8000}:8000"
    environment:
      BANKCHECK_PASSWORD: ${BANKCHECK_PASSWORD:?define BANKCHECK_PASSWORD en el archivo .env}
      TZ: ${TZ:-America/Santiago}
      BANKCHECK_NTFY_URL: ${BANKCHECK_NTFY_URL:-}
      BANKCHECK_NTFY_TOKEN: ${BANKCHECK_NTFY_TOKEN:-}
      BANKCHECK_NOTIFY_DETAILS: ${BANKCHECK_NOTIFY_DETAILS:-}
    volumes:
      # History (bank.db) and uploaded originals; create it before the first start
      - ./data:/data
