[project]
name = "bankcheck"
version = "0.9.0"
description = "Find unpaid purchases in the bank's current-period movements export."
readme = "readme.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.159.1",
    "jinja2>=3.1.6",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
    "xlrd>=2.0",
]

[project.scripts]
bankcheck = "bankcheck.cli:main"
bankcheck-web = "bankcheck.web.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
]
